<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="description" content="KARAKURI（からくり）— 行動科学・社会心理学の査読論文を日本の読者向けに独自解説。毎日更新の新着論文フィードと深掘り研究解説。" />
  <title>KARAKURI — 行動科学と人間心理の独自解説</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header>
    <div class="header-container">
      <div class="brand">
        <h1><a href="/">KARAKURI</a></h1>
        <p>行動科学・社会心理学の査読論文を日本語で独自解説</p>
      </div>
      <nav>
        <a href="/policy.html">出典・引用方針・免責</a>
      </nav>
    </div>
  </header>

  <main>
    <section>
      <div class="section-head">
        <span class="eyebrow">DEEP DIVE</span>
        <h2 class="section-title">深掘り研究解説</h2>
        <p class="section-desc">ひとりの研究者・ひとつの問いに、じっくり向き合う手書きの解説</p>
      </div>
      <div id="articles-container" class="articles-grid">
        <p class="error-msg">読み込み中...</p>
      </div>
    </section>

    <section>
      <div class="section-head">
        <span class="eyebrow">NEW PAPERS</span>
        <h2 class="section-title">新着論文フィード</h2>
        <p class="section-desc">査読ずみ研究の「いま」を、短く、やさしく。出典は常に DOI。</p>
      </div>
      <div class="feed-toolbar">
        <input
          type="search"
          id="feed-search"
          class="search-input"
          placeholder="タイトル・著者・掲載誌で検索…"
          aria-label="論文を検索"
          autocomplete="off"
        />
        <select id="feed-tag" class="tag-select" aria-label="テーマで絞り込み"></select>
        <select id="feed-sort" class="tag-select" aria-label="並び順">
          <option value="new">新着順</option>
          <option value="published">発表日順</option>
          <option value="title">タイトル順</option>
          <option value="venue">掲載誌順</option>
        </select>
        <span id="feed-count" class="feed-count" aria-live="polite"></span>
      </div>
      <div id="feed-container" class="feed-list">
        <p class="error-msg">読み込み中...</p>
      </div>
      <nav id="feed-pager" class="feed-pager" aria-label="フィードのページ送り"></nav>
    </section>
  </main>

  <footer>
    <p>&copy; KARAKURI | <a href="/policy.html">出典・引用方針・免責事項</a></p>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
