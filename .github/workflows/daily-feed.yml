name: Daily Feed Drafts

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch new papers from OpenAlex
        run: npm run feed:fetch
        env:
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}

      - name: Generate LLM draft summaries
        run: npm run feed:draft
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # Policy B: high-confidence drafts (with DOI + all Japanese fields) go
      # straight to "approved"; the publish step then moves them to the public
      # feed. Low-confidence / incomplete items stay "draft" for human review.
      - name: Auto-approve high-confidence drafts
        run: npm run feed:autoapprove

      - name: Publish approved items to the public feed
        run: npm run feed:publish

      - name: Commit drafts and inbox changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/inbox.json
          if ! git diff --cached --quiet; then git commit -m "feed: draft $(date +'%Y-%m-%d')"; fi

      - name: Commit published feed items
        run: |
          git add data/inbox.json public/data/papers.json
          if ! git diff --cached --quiet; then git commit -m "feed: publish $(date +'%Y-%m-%d')"; fi

      - name: Push
        run: git push