name: Daily Feed Drafts

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch new papers from OpenAlex
        run: npm run feed:fetch
        env:
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}

      - name: Generate LLM draft summaries
        run: npm run feed:draft
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit and push inbox.json drafts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/inbox.json
          git diff --cached --quiet || git commit -m "feed: draft $(date +'%Y-%m-%d')" && git push
